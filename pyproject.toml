[project]
name = "ai-financial-risk-early-warning-system"
version = "0.1.0"
description = "Market risk early warning with market ML + pretrained sentiment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "yfinance>=0.2.40",
  "joblib>=1.3",
]

[project.optional-dependencies]
nlp = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8.0"]

[project.scripts]
risk-ews = "ai_risk_system.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
